services:
  ecommerce-api:
    build: .
    container_name: heritagehub-api
    ports:
      - "8084:8084"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/health"]
      interval: 30s
      timeout: 5s
      retries: 3

